name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Agent self test (simulated Quarkus FacadeClassLoader)
        run: tests/agent-selftest/run.sh

      - name: Build plugin, feature and update site
        run: mvn -B -ntp verify

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp site/target/repository/plugins/io.github.christianlinzatti.rundisabled_*.jar dist/
          cp site/target/io.github.christianlinzatti.rundisabled.site-*.zip dist/eclipse-run-disabled-updatesite.zip
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-run-disabled
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created in the GitHub UI) - then just attach the files.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
